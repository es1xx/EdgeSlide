[workspace]
members = ["edgeslide-core", "edgeslide-daemon", "edgeslide-settings"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
gio = "0.21"
glib = "0.21"
[profile.release]
lto = "thin"
strip = true
